blueprint:
  name: Heating from booking calendars
  description: >-
    Heats a rental from its booking calendars: comfort while guests stay,
    an eco set point when empty (lower for long gaps), a pre-heat that starts
    from the measured indoor temperature and the heating's warm-up rate, and
    frost protection outside the heating season. Guest changes up to a limit
    are kept; anything above it is reset. If a calendar fails to load, nothing
    changes. Runs every 30 minutes.
  domain: automation
  source_url: https://github.com/Airbloomer/ha-booking-heating/blob/main/blueprints/automation/airbloomer/booking_heating.yaml
  author: Airbloomer
  homeassistant:
    min_version: 2024.10.0
  input:
    devices:
      name: Devices and calendars
      icon: mdi:home-thermometer
      input:
        climate_entity:
          name: Thermostat
          selector:
            entity:
              domain: climate
        calendars:
          name: Booking calendars
          description: One or more calendars (Airbnb, Booking.com, your own site). All-day events from the check-in day to the check-out day.
          selector:
            entity:
              domain: calendar
              multiple: true
        ignore_keywords:
          name: Ignore events containing
          description: Comma-separated, case-insensitive. Airbnb exports owner blocks as "Airbnb (Not available)".
          default: "not available, blocked"
          selector:
            text: {}
        state_helper:
          name: State helper
          description: An input_text helper (max length 32 or more) where the automation stores the last plan it wrote. Create it under Settings > Devices & services > Helpers.
          selector:
            entity:
              domain: input_text
        season_override:
          name: Season override (optional)
          description: An input_boolean. When on, heats normally outside the season. It turns itself off on the first run inside the season.
          default: []
          selector:
            entity:
              domain: input_boolean
        assume_vacant_until:
          name: Assume empty until (optional)
          description: >-
            An input_datetime helper (date, or date and time). Until that moment,
            stays that start before it are ignored, so the home is heated as empty.
            It expires by itself: from that moment the calendars count again, and a
            stay that starts on or after it is pre-heated as usual, even if pre-heat
            has to begin before it. Empty or unreadable means no effect.
          default: []
          selector:
            entity:
              domain: input_datetime
        write_mode:
          name: How to change the thermostat
          description: >-
            "set_temperature" works with most thermostats. "finderblissha_schedule" writes a
            weekly schedule through the Finder Bliss integration (needed for Bliss 2, whose
            manual set points switch it off).
          default: set_temperature
          selector:
            select:
              options:
                - set_temperature
                - finderblissha_schedule
        dry_run:
          name: Dry run
          description: Log what would be written (logbook) without changing the thermostat.
          default: false
          selector:
            boolean: {}
    stays:
      name: Stays
      icon: mdi:calendar-clock
      input:
        check_in_time:
          name: Check-in time
          default: "16:00:00"
          selector:
            time: {}
        check_out_time:
          name: Check-out time
          default: "11:00:00"
          selector:
            time: {}
    temperatures:
      name: Temperatures
      icon: mdi:thermometer
      input:
        comfort_temp:
          name: Occupied, day
          default: 20
          selector:
            number: {min: 5, max: 25, step: 0.5, unit_of_measurement: "°C"}
        night_temp:
          name: Occupied, night
          default: 19
          selector:
            number: {min: 5, max: 25, step: 0.5, unit_of_measurement: "°C"}
        day_start:
          name: Day starts
          default: "05:00:00"
          selector:
            time: {}
        night_start:
          name: Night starts
          default: "22:00:00"
          selector:
            time: {}
        vacant_short_temp:
          name: Empty, short gap
          default: 17
          selector:
            number: {min: 5, max: 25, step: 0.5, unit_of_measurement: "°C"}
        vacant_long_temp:
          name: Empty, long gap
          default: 15
          selector:
            number: {min: 5, max: 25, step: 0.5, unit_of_measurement: "°C"}
        long_gap_days:
          name: A gap is long from
          default: 5
          selector:
            number: {min: 1, max: 60, step: 1, unit_of_measurement: days}
        off_season_temp:
          name: Outside the season (frost protection)
          default: 5
          selector:
            number: {min: 5, max: 25, step: 0.5, unit_of_measurement: "°C"}
        max_guest_temp:
          name: Reset guest changes above
          description: If the thermostat's set point is above this, the plan is written again at the next run.
          default: 21
          selector:
            number: {min: 5, max: 30, step: 0.5, unit_of_measurement: "°C"}
    preheat:
      name: Pre-heat
      icon: mdi:radiator
      input:
        warmup_rate:
          name: Warm-up rate
          description: How fast the heating raises the indoor temperature once running. Floor heating is often 0.3-1 °C/h; radiators faster. Measure it on your first cold arrival and adjust.
          default: 0.5
          selector:
            number: {min: 0.1, max: 5, step: 0.1, unit_of_measurement: "°C/h"}
        heating_lag:
          name: Start-up lag
          description: Delay before the heating starts warming the air (floor heating 2-3 h).
          default: 2.5
          selector:
            number: {min: 0, max: 12, step: 0.5, unit_of_measurement: h}
        margin:
          name: Safety margin
          default: 3
          selector:
            number: {min: 0, max: 24, step: 0.5, unit_of_measurement: h}
        max_preheat:
          name: Longest pre-heat
          default: 36
          selector:
            number: {min: 1, max: 96, step: 1, unit_of_measurement: h}
    season:
      name: Heating season
      icon: mdi:snowflake
      input:
        season_start:
          name: Season starts (MM-DD)
          description: Two-digit month and day, e.g. 11-01. Set start 01-01 and end 12-31 to heat all year. An invalid value means "heat all year" (never frost by mistake).
          default: "11-01"
          selector:
            text: {}
        season_end:
          name: Season ends (MM-DD)
          description: Two-digit month and day, e.g. 03-31.
          default: "03-31"
          selector:
            text: {}

mode: single
max_exceeded: silent

triggers:
  - trigger: time_pattern
    minutes: "/30"
  - trigger: homeassistant
    event: start

variables:
  climate_entity: !input climate_entity
  calendars: !input calendars
  ignore_keywords: !input ignore_keywords
  state_helper: !input state_helper
  season_override: !input season_override
  assume_vacant_until: !input assume_vacant_until
  write_mode: !input write_mode
  dry_run: !input dry_run
  check_in_time: !input check_in_time
  check_out_time: !input check_out_time
  comfort_temp: !input comfort_temp
  night_temp: !input night_temp
  day_start: !input day_start
  night_start: !input night_start
  vacant_short_temp: !input vacant_short_temp
  vacant_long_temp: !input vacant_long_temp
  long_gap_days: !input long_gap_days
  off_season_temp: !input off_season_temp
  max_guest_temp: !input max_guest_temp
  warmup_rate: !input warmup_rate
  heating_lag: !input heating_lag
  margin: !input margin
  max_preheat: !input max_preheat
  season_start: !input season_start
  season_end: !input season_end
  override_entity: "{{ season_override if season_override is string else (season_override | first | default('')) }}"
  vacant_until_entity: "{{ assume_vacant_until if assume_vacant_until is string else (assume_vacant_until | first | default('')) }}"

conditions:
  - condition: template
    value_template: "{{ states(climate_entity) not in ['unavailable', 'unknown'] }}"

actions:
  - action: calendar.get_events
    target:
      entity_id: "{{ calendars }}"
    data:
      start_date_time: "{{ (now() - timedelta(days=60)).isoformat() }}"
      end_date_time: "{{ (now() + timedelta(days=150)).isoformat() }}"
    response_variable: cal
    continue_on_error: true
  - variables:
      cal_ok: >-
        {%- set cals = calendars if calendars is list else [calendars] -%}
        {{ cal is defined and cal is mapping
           and cals | select('in', cal) | list | count == cals | count
           and cals | map('states') | select('in', ['unavailable', 'unknown']) | list | count == 0 }}
      events: >-
        {%- set cals = calendars if calendars is list else [calendars] -%}
        {%- set ns = namespace(ev=[]) -%}
        {%- if cal_ok -%}{%- for c in cals -%}{%- set ns.ev = ns.ev + cal[c].events -%}{%- endfor -%}{%- endif -%}
        {{ ns.ev }}
      applied: "{{ states(state_helper) }}"
      prev_plan: "{{ applied.split(':')[0] }}"
      plans_valid: "{{ ['occupied', 'preheat', 'vacant_short', 'vacant_long', 'off_season'] }}"
      season_ok: >-
        {{ season_start is match('^(0[1-9]|1[0-2])-(0[1-9]|[12][0-9]|3[01])$')
           and season_end is match('^(0[1-9]|1[0-2])-(0[1-9]|[12][0-9]|3[01])$') }}
      in_season: >-
        {%- set md = now().strftime('%m-%d') -%}
        {{ not season_ok or ((md >= season_start or md <= season_end) if season_start > season_end else (season_start <= md <= season_end)) }}
      override_on: "{{ override_entity != '' and is_state(override_entity, 'on') }}"
      vacant_until_ts: >-
        {%- set raw = states(vacant_until_entity) if vacant_until_entity != '' else '' -%}
        {%- set v = as_datetime(raw) if raw is match('^\\d{4}-\\d{2}-\\d{2}( \\d{2}:\\d{2}(:\\d{2})?)?$') else none -%}
        {{ (v | as_local).timestamp() if v is not none else 0 }}
  - variables:
      final_plan: >-
        {%- if not cal_ok -%}{{ prev_plan if prev_plan in plans_valid else 'none' }}{%- else -%}
        {%- macro ts(d, t) -%}{{ (as_datetime((d | string)[:10] ~ ' ' ~ t) | as_local).timestamp() }}{%- endmacro -%}
        {%- macro season_at(md) -%}{{ not season_ok or ((md >= season_start or md <= season_end) if season_start > season_end else (season_start <= md <= season_end)) }}{%- endmacro -%}
        {%- set kw = ignore_keywords.split(',') | map('trim') | map('lower') | reject('eq', '') | list -%}
        {%- set nowts = now().timestamp() -%}
        {%- set ns = namespace(occ=false, prev=none, next=none) -%}
        {%- for e in events -%}
          {%- set title = e.summary | default('') | lower -%}
          {%- if kw | select('in', title) | list | count == 0 -%}
            {%- set a = ts(e.start, check_in_time) | float -%}
            {%- set b = ts(e.end, check_out_time) | float -%}
            {%- if nowts >= vacant_until_ts | float or a >= vacant_until_ts | float -%}
            {%- if a <= nowts < b %}{% set ns.occ = true %}{% endif -%}
            {%- if b <= nowts and (ns.prev is none or b > ns.prev) %}{% set ns.prev = b %}{% endif -%}
            {%- if a > nowts and (ns.next is none or a < ns.next) %}{% set ns.next = a %}{% endif -%}
            {%- endif -%}
          {%- endif -%}
        {%- endfor -%}
        {%- if ns.occ -%}{%- set raw = 'occupied' -%}
        {%- elif ns.next is none -%}{%- set raw = 'vacant_long' -%}
        {%- else -%}
          {%- set long = ns.prev is none or (ns.next - ns.prev) >= long_gap_days | float * 86400 -%}
          {%- set lvl = vacant_long_temp | float if long else vacant_short_temp | float -%}
          {%- set cur = state_attr(climate_entity, 'current_temperature') -%}
          {%- set start_t = cur if cur is number else lvl -%}
          {%- set need = [comfort_temp | float - start_t, 0] | max -%}
          {%- set lead = ([heating_lag | float + need / ([warmup_rate | float, 0.1] | max) + margin | float, max_preheat | float] | min) * 3600 -%}
          {%- set until = ns.next - nowts -%}
          {%- if until <= lead or (prev_plan == 'preheat' and until <= max_preheat | float * 3600) -%}{%- set raw = 'preheat' -%}
          {%- else -%}{%- set raw = 'vacant_long' if long else 'vacant_short' -%}{%- endif -%}
        {%- endif -%}
        {%- if raw == 'preheat' -%}{%- set heat = override_on or season_at(ns.next | timestamp_custom('%m-%d', true)) == 'True' -%}
        {%- else -%}{%- set heat = override_on or in_season -%}{%- endif -%}
        {{ raw if heat else 'off_season' }}
        {%- endif -%}
      day_now: >-
        {%- set t = now().strftime('%H:%M:%S') -%}
        {{ day_start <= t < night_start }}
      target_temp: >-
        {%- if final_plan in ['occupied', 'preheat'] -%}{{ (comfort_temp if day_now else night_temp) | float }}
        {%- elif final_plan == 'vacant_short' -%}{{ vacant_short_temp | float }}
        {%- elif final_plan == 'vacant_long' -%}{{ vacant_long_temp | float }}
        {%- elif final_plan == 'off_season' -%}{{ off_season_temp | float }}
        {%- else -%}none{%- endif -%}
      setpoint: "{{ state_attr(climate_entity, 'temperature') }}"
      too_hot: >-
        {{ setpoint is number and setpoint > [max_guest_temp | float, comfort_temp | float, night_temp | float] | max }}
      key: >-
        {{ final_plan if write_mode == 'finderblissha_schedule' else final_plan ~ ':' ~ target_temp }}
      blocks: >-
        {%- if final_plan in ['occupied', 'preheat'] -%}
        {{ [{'from': '00:00', 'to': day_start[:5], 'temp': night_temp | float},
            {'from': day_start[:5], 'to': night_start[:5], 'temp': comfort_temp | float},
            {'from': night_start[:5], 'to': '24:00', 'temp': night_temp | float}] }}
        {%- else -%}{{ [{'from': '00:00', 'to': '24:00', 'temp': target_temp | float(0)}] }}{%- endif -%}
  - if:
      - condition: template
        value_template: "{{ in_season and override_on and not dry_run }}"
    then:
      - action: input_boolean.turn_off
        target:
          entity_id: "{{ override_entity }}"
  - condition: template
    value_template: "{{ final_plan in plans_valid and (cal_ok or too_hot) and (key != applied or too_hot) }}"
  - if:
      - condition: template
        value_template: "{{ dry_run }}"
    then:
      - action: logbook.log
        data:
          name: Booking heating (dry run)
          message: "would write {{ key }}{{ ' (set point above limit)' if too_hot else '' }}; calendars ok: {{ cal_ok }}"
          entity_id: "{{ climate_entity }}"
    else:
      - if:
          - condition: template
            value_template: "{{ write_mode == 'finderblissha_schedule' }}"
        then:
          - action: finderblissha.set_schedule
            target:
              entity_id: "{{ climate_entity }}"
            data:
              blocks: "{{ blocks }}"
        else:
          - action: climate.set_temperature
            target:
              entity_id: "{{ climate_entity }}"
            data:
              temperature: "{{ target_temp }}"
      - action: input_text.set_value
        target:
          entity_id: "{{ state_helper }}"
        data:
          value: "{{ key }}"
      - action: logbook.log
        data:
          name: Booking heating
          message: "wrote {{ key }}{{ ' (set point above limit)' if too_hot else '' }}"
          entity_id: "{{ climate_entity }}"
